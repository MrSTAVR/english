name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # версия сайта считается по числу коммитов
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # как на сервере (Debian 12)
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
