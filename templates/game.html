{% extends "base.html" %}
{% block title %}{{ info.title }} — English Fun{% endblock %}
{% block content %}
<div class="dict-head">
  <a class="btn btn-small" href="{{ url_for('games.games_hub', lesson=lesson.id if lesson else None) }}">⬅ Все игры</a>
  <h1>{{ info.emoji }} {{ info.title }}</h1>
</div>
<p class="subtitle">{{ info.desc }}</p>
<section class="card">
  <div id="game" data-game="{{ game }}" data-words='{{ words | tojson }}' data-distract='{{ distract | tojson }}'></div>
</section>
<section class="card hero hidden" id="game-end">
  <div class="big-emoji" id="game-end-emoji">🏅</div>
  <h2 id="game-end-title">Игра окончена!</h2>
  <p id="game-end-text"></p>
  <p class="sp-stars" id="game-end-stars"></p>
  <a class="btn btn-primary" href="{{ url_for('games.game_play', game=game, lesson=lesson.id if lesson else None) }}">Ещё раз 🔁</a>
  <a class="btn btn-secondary" href="{{ url_for('games.games_hub', lesson=lesson.id if lesson else None) }}">Другая игра</a>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='games.js') }}?v=3"></script>{% endblock %}
