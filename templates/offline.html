<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Нет интернета — English Fun</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: "Nunito", "Segoe UI", Verdana, sans-serif; color: #241d47; text-align: center;
         background: linear-gradient(160deg, #efe9ff, #ffe9f4); padding: 24px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 24px; padding: 32px 24px; max-width: 360px;
          box-shadow: 0 18px 44px rgba(90,63,214,.22); }
  .emoji { font-size: 64px; }
  h1 { margin: 8px 0; font-size: 1.5rem; }
  p { color: #6f6a8a; line-height: 1.5; }
  button { margin-top: 12px; border: 0; border-radius: 16px; padding: 14px 28px; font-size: 1.05rem;
           font-weight: 800; color: #fff; background: #7c5cff; font-family: inherit; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🐣📡</div>
    <h1>Нет интернета</h1>
    <p>Чик-чик не может достучаться до сервера. Проверь Wi-Fi или мобильную сеть и попробуй ещё раз.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
